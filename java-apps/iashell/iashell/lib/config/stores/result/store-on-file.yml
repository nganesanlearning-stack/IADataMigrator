store:
  name: ${store.name.result-store:default-result-store}
  bucket: null
  fileSystemFolder: default-result-folder
  storeType: result

fileSystemFolder:
  name: default-result-folder
  parentSpaceRootFolder: ${application.name}-space-root-folder
  subPath: stores/${store.name.result-store:default-result-store}

spaceRootFolder:
  name: ${application.name}-space-root-folder
  fileSystemRoot: defaultFileSystemRoot

# References to the administration resources
fileSystemRoot:
  name: defaultFileSystemRoot
  configure: use_existing

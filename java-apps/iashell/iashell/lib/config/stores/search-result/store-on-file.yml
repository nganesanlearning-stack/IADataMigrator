store:
  name: ${store.name.search-result-store:default-search-result-store}
  bucket: null
  fileSystemFolder: default-search-result-folder
  storeType: search result

fileSystemFolder:
  name: default-search-result-folder
  parentSpaceRootFolder: ${application.name}-space-root-folder
  subPath: stores/${store.name.search-result-store:default-search-result-store}

spaceRootFolder:
  name: ${application.name}-space-root-folder
  fileSystemRoot: defaultFileSystemRoot

# References to the administration resources
fileSystemRoot:
  name: defaultFileSystemRoot
  configure: use_existing
